name: Check

# On a push to a branch or a pull request: runs the node check, and on a pull
# request the commit check. Deploy workflows call this workflow before they
# build.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    uses: gtfs-zone/.github/.github/workflows/node-check.yml@ed1f371c0a094ac56ceb2a05e1c83f79fc719838 # main

  commits:
    if: github.event_name == 'pull_request'
    uses: gtfs-zone/.github/.github/workflows/commit-check.yml@ed1f371c0a094ac56ceb2a05e1c83f79fc719838 # main
